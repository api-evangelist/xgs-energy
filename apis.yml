aid: xgs-energy
name: XGS Energy
description: 'XGS Energy is a next-generation geothermal power developer founded in 2008 and headquartered in Palo
  Alto, California, formerly Geothermic Solution. Its patented Thermal Reach Enhancement technology packs a thermally
  conductive material around a closed-loop wellbore so heat is drawn from the surrounding rock without relying on
  natural permeability or produced water, siting geothermal in geology conventional hydrothermal and EGS cannot
  use. It is developing a 150 MW round-the-clock project in New Mexico with Meta and utility PNM, and in 2025 acquired
  drilling firm Capuano Engineering. XGS Energy is an energy infrastructure developer, not a software vendor: it
  publishes no developer program, product API, SDKs or API documentation. The only machine-readable interface it
  exposes is the WordPress REST content API behind www.xgsenergy.com, captured here for discovery — anonymously
  readable, read-only, and undocumented by the company.'
